[project]
name = "specweaver"
version = "0.1.0"
description = "Specification-driven development lifecycle tool"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "sbula" },
]

dependencies = [
    "typer[all]>=0.21",
    "google-genai>=1.0.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "orjson>=3.9.0",
    "ruamel.yaml>=0.18",
    "tomlkit>=0.12.0",
    "jinja2>=3.1",
    "tree-sitter>=0.25.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.24.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-kotlin>=1.1.0",
    "tree-sitter-markdown>=0.3.0",
    "tree-sitter-sql>=0.3.11",
    "junitparser>=3.1.2",
    "sarif-tools>=1.0.0",
    "proto-schema-parser>=0.5.0",
    "pathspec>=0.12.0",
    "networkx==3.6.1",
]

[project.scripts]
sw = "specweaver.interfaces.cli.main:app"

[project.optional-dependencies]
openai = ["openai>=1.5"]
anthropic = ["anthropic>=0.25"]
mistral = ["mistralai>=1.0"]
qwen = ["openai>=1.5"]
all-llm = ["openai>=1.5", "anthropic>=0.25", "mistralai>=1.0"]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.9",
    "markdown>=3.5",
    "bleach>=6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specweaver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = "--import-mode=importlib -v --tb=short -m 'not live'"
markers = [
    "live: tests that require real external API keys and network access",
    "integration: tests that exercise multiple layers but mock external dependencies",
    "e2e: end-to-end tests that simulate full real-world scenarios",
]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "RUF", # ruff-specific rules
    "C90", # mccabe complexity
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"src/specweaver/sandbox/execution/*.py" = ["TID251"]
"tests/**" = ["TID251"]
# Declared exemption (user, 2026-07-28): `scripts/quality.py` shells out to ruff/mypy/tach with
# stdlib subprocess rather than SubprocessExecutor. SubprocessExecutor lives in
# src/specweaver/sandbox/, and a quality gate that imports the product it checks cannot run when
# that product is broken — precisely when the gate is needed.
"scripts/**" = ["TID251"]
# `TECH-035`: the reading mixin restates `SCM_*` as property stubs under `TYPE_CHECKING`, purely to
# declare what it needs from the parser it is mixed into. The names must match the abstract
# properties they mirror, which are uppercase by long-standing convention (tree-sitter `.scm`
# queries) and already carry their own N802 exemption in `base.py`. Configured here rather than as
# three call-site `noqa`s, per the suppressions gate's own instruction.
"src/specweaver/workspace/ast/parsers/_reading.py" = ["N802"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Use SubprocessExecutor from specweaver.sandbox.execution.executor instead."

[tool.ruff.lint.isort]
known-first-party = ["specweaver"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
explicit_package_bases = true
mypy_path = "src"

# `bleach` and `markdown` ship no type stubs. Declared here -- ONE reviewable place -- rather than
# as `# type: ignore` at each import, which is what `interfaces/api/ui/` carried twice over before
# `TECH-037` unified the two UI modules. The suppressions gate exists to push exactly this way
# round: configure the rule, do not silence the call site.
[[tool.mypy.overrides]]
module = ["bleach.*", "markdown.*"]
ignore_missing_imports = true

[dependency-groups]
# Everything the project needs to test, lint and boundary-check itself. `uv` installs
# dependency-groups by DEFAULT and extras only on request, so this must be the whole set: a plain
# `uv sync` has to produce an environment the gates can run in.
#
# These were previously split across this group and a `[project.optional-dependencies] dev` of the
# same name, with `pytest-xdist` here and `pytest` there. A default sync therefore installed the
# parallel-test plugin without the test runner and the suite reported 5347 errors. `tests/unit/
# test_dependency_manifest.py` now fails if a name is ever declared in both places again.
#
# Extras below are reserved for genuine user-facing options (LLM providers, the REST server).
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.11",
    "mypy>=1.15",
    "tach",
    "complexipy>=6.2.0",
    "respx>=0.21.1",
    "httpx>=0.28",
    "types-networkx>=3.6.1.20260408",
    "types-pyyaml>=6.0.12.20260408",
    # The suite exercises the REST layer and every LLM adapter, so testing the project requires
    # those features installed.
    # Referenced rather than duplicated: listing fastapi/uvicorn here as well would be a second
    # place to keep in step, which is the shape of the defect this ticket removes.
    "specweaver[serve]",
    "specweaver[all-llm]",
]
