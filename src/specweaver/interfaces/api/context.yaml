name: api
level: module
purpose: >
  FastAPI REST API server for SpecWeaver. Exposes all CLI operations
  as HTTP endpoints for external UIs, CI/CD, and IDE extensions.

archetype: adapter

consumes:
  - specweaver/core/config
  - specweaver/assurance/validation
  - specweaver/workflows/review
  - specweaver/workflows/implementation
  - specweaver/core/flow
  - specweaver/graph
  - specweaver/infrastructure/llm  # Pure logic modules must not depend on LLMs or prompt generation.
  - specweaver/workspace/project
  - specweaver/interfaces/run_setup  # every endpoint builds its run here
  - specweaver/assurance/standards

forbids:
  - specweaver/interfaces/cli
  - specweaver/sandbox/*

exposes:
  - create_app

# -- Operational Metadata --------------------------------------------------
operational:
  async_ready: true
  concurrency_model: none
