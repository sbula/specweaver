name: run_doors
level: module
purpose: >
  How a CLI command starts a run: build it through the run builder, turn its errors into a
  message and exit code 1, and run a one-step pipeline.

archetype: orchestrator

consumes:
  - specweaver/interfaces/cli_kit
  - specweaver/interfaces/run_setup
  - specweaver/infrastructure/llm
  - specweaver/core/config
  - specweaver/core/flow
  - specweaver/workspace

forbids:
  - specweaver/interfaces/cli  # the shell imports the CLIs; the doors sit below all of them

exposes:
  - run_doors

# -- Operational Metadata --------------------------------------------------
operational:
  async_ready: false
  concurrency_model: none
