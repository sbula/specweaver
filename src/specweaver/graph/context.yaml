name: graph
purpose: >
  The code graph (engine, store, builder), the module graph (topology) and artifact lineage.
archetype: orchestrator

description: "Bounded context for the SpecWeaver graphs: the code graph extracted from source ('core'),
  the module graph declared by context.yaml files ('topology'), and artifact lineage ('lineage')."
consumes:
  - specweaver/commons
  - specweaver/infrastructure/database
  - specweaver/workspace/ast/adapters
forbids:
  - specweaver/interfaces/cli
  - specweaver/interfaces/api
  - specweaver/core/config
