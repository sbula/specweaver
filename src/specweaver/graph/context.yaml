name: graph
purpose: >
  The knowledge graph: its engine, store and builder, plus lineage and topology.
archetype: orchestrator

description: "Bounded context for the SpecWeaver graphs. Contains the universal 'core' mechanics (Engine,
  Store, Builder) as well as topic-specific extensions (Lineage, Topology)."
consumes:
  - specweaver/commons
  - specweaver/infrastructure/database
  - specweaver/sandbox
  - specweaver/workspace/ast/adapters
forbids:
  - specweaver/interfaces/cli
  - specweaver/interfaces/api
  - specweaver/core/config
