# Bounded context for the Graph Interfaces
name: graph-cli
purpose: >
  The `sw graph` and `sw lineage` commands.

description: "CLI interfaces for the Knowledge Graph and Lineage systems"

archetype: orchestrator

exposes:
  - cli

consumes:
  - specweaver/interfaces/cli_kit
  - specweaver/graph/topology
  - specweaver/core/config
  - specweaver/graph
  - specweaver/graph/lineage
widens:
  specweaver/interfaces/cli_kit: "`sw graph` prints through it"
  specweaver/core/config: "`sw graph` reads the config DB path (cli.py)"
