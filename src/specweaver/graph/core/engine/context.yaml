name: graph-engine
purpose: >
  The in-memory graph (NetworkX) and its ontology; no I/O.
archetype: pure-logic

description: "Pure logic layer of the Knowledge Graph. Contains the NetworkX wrapper and Ontology models."
consumes:
  - specweaver/graph/core/engine/*
  - specweaver/commons
forbids:
  - specweaver/graph/core/store
  - specweaver/graph/core/builder
