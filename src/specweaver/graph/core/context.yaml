# Bounded context for the Graph Core
name: graph-core
purpose: >
  The graph mechanics shared by every graph topic: engine, store and builder.

description: "Core logic for Knowledge Graph construction and traversal"

archetype: orchestrator

consumes:
  - specweaver/commons
  - specweaver/infrastructure/database
  - specweaver/workspace/ast/adapters

exposes:
  - builder
  - engine
  - store

