# The models SpecWeaver is used with, and what each costs and can do. Edited by hand; the machine
# settings file wins over it ([models."<id>"]). A fact left out is unknown, never false or 0.
#
# Prices are USD per 1M tokens, taken from models.dev (MIT licence, Copyright (c) 2025 models.dev).
# Where a model has tiers (long prompts, cache writes, reasoning), the highest price is written, so
# a call is never under-counted. Add a model by copying an entry and checking its provider's price.

schema_version = 1
checked = "2026-10-08"

# Whether the one output limit a call sends also bounds the model's hidden thinking.
# Checked against each provider's documentation on 2026-09-27. Mistral and Qwen do not say, so
# they are left unknown.
[kinds.openai]
thinking_in_output_cap = true   # max_completion_tokens counts reasoning tokens

[kinds.anthropic]
thinking_in_output_cap = true   # thinking tokens count toward max_tokens

[kinds.gemini]
thinking_in_output_cap = true   # max_output_tokens includes thought tokens

[models."anthropic/claude-opus-5-5"]
context = 1000000
max_output = 128000
tool_calls = true
usd_per_million_input = 5
usd_per_million_output = 20

[models."anthropic/claude-sonnet-5"]
context = 1000000
max_output = 128000
tool_calls = true
usd_per_million_input = 2.5
usd_per_million_output = 10

[models."anthropic/claude-haiku-4-5"]
context = 200000
max_output = 64000
tool_calls = true
usd_per_million_input = 1.25
usd_per_million_output = 5

[models."openai/gpt-5.6"]
context = 1050000
max_output = 128000
tool_calls = true
usd_per_million_input = 10
usd_per_million_output = 30

[models."openai/gpt-5.6-luna"]
