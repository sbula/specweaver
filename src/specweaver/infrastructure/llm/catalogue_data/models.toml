specials = [
  { kind = "cache_write", usd_per_million = 2, max_age_seconds = 3600 },
  { kind = "cached_read", usd_per_million = 0.1, min_prefix_tokens = 4096, max_age_seconds = 300, requires = "breakpoint" },
]

