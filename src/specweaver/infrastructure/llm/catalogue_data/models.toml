# The models SpecWeaver is used with, and what each costs and can do. Edited by hand; the machine
# settings file wins over it ([models."<id>"]). A fact left out is unknown, never false or 0.
#
# Prices are USD per 1M tokens, taken from models.dev (MIT licence, Copyright (c) 2025 models.dev).
# Where a model has long-prompt tiers, the highest price is written, so a call is never under-counted.
# Add a model by copying an entry and checking its provider's price.
#
# Cached input is priced on its own. `specials` are prices that apply only while their rule holds:
# the shortest cached prefix (min_prefix_tokens), how long a cache lives (max_age_seconds), and what
# the request must send (requires: breakpoint or cache_key). The rules are from each provider's
# caching page, read 2026-10-17 (docs/analysis/prompt_caching_2026-10-17.md); models.dev has none.

schema_version = 1
checked = "2026-10-17"

# Whether the one output limit a call sends also bounds the model's hidden thinking.
# Checked against each provider's documentation on 2026-09-27. Mistral and Qwen do not say, so
# they are left unknown.
[kinds.openai]
thinking_in_output_cap = true   # max_completion_tokens counts reasoning tokens

[kinds.anthropic]
thinking_in_output_cap = true   # thinking tokens count toward max_tokens

[kinds.gemini]
thinking_in_output_cap = true   # max_output_tokens includes thought tokens

[models."anthropic/claude-opus-5-5"]
context = 1000000
max_output = 128000
tool_calls = true
usd_per_million_input = 4
usd_per_million_output = 20
usd_per_million_cache_write = 5   # a 5-minute cache
specials = [
  { kind = "cache_write", usd_per_million = 8, max_age_seconds = 3600 },
  { kind = "cached_read", usd_per_million = 0.2, min_prefix_tokens = 512, max_age_seconds = 300, requires = "breakpoint" },
]

[models."anthropic/claude-sonnet-5"]
context = 1000000
max_output = 128000
tool_calls = true
usd_per_million_input = 2
usd_per_million_output = 10
usd_per_million_cache_write = 2.5   # a 5-minute cache
specials = [
  { kind = "cache_write", usd_per_million = 4, max_age_seconds = 3600 },
  { kind = "cached_read", usd_per_million = 0.2, min_prefix_tokens = 1024, max_age_seconds = 300, requires = "breakpoint" },
]

[models."anthropic/claude-haiku-4-5"]
