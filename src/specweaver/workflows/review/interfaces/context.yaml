# src/specweaver/workflows/review/interfaces/context.yaml
name: review-cli

archetype: entry-point
purpose: CLI entrypoints for review workflows
consumes:
  - specweaver/interfaces/cli_kit
  - specweaver/interfaces/run_doors
  - specweaver/core/flow
  - specweaver/infrastructure/llm
  - specweaver/workflows/review
widens:
  specweaver/interfaces/cli_kit: "`sw review` prints and prompts through it"
  specweaver/interfaces/run_doors: "`sw review` starts its run through it"
  specweaver/core/flow: "`sw review` builds the review step and reads its result"
forbids: []
