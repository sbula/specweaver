name: languages
level: module
purpose: >
  What the code generator tells the model, per language: the code and tests instructions and
  the model's role lines.

description: |
  One markdown file per language, read by `workflows.implementation.languages`. A project's
  `.specweaver/languages/<lang>.md` replaces the shipped file. Not a Python module — only data files.

archetype: data

consumes: []

forbids: []

exposes:
  - python.md
  - java.md
  - kotlin.md
  - typescript.md
  - rust.md

# -- Operational Metadata --------------------------------------------------
operational:
  async_ready: false
  concurrency_model: none
