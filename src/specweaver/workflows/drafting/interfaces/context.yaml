name: drafting-cli

archetype: entry-point
purpose: CLI entrypoint for drafting a spec (sw draft)
consumes:
  - specweaver/interfaces/cli_kit
  - specweaver/interfaces/run_doors
  - specweaver/core/flow
widens:
  specweaver/interfaces/cli_kit: "`sw draft` prints and prompts through it"
  specweaver/interfaces/run_doors: "`sw draft` starts its run through it"
  specweaver/core/flow: "`sw draft` reads step models and results"
forbids:
  - specweaver/sandbox/*
