name: sandbox
level: module
purpose: >
  The execution boundary: agent tools, engine atoms, the dispatcher and the workspace security that every file, git, test and network action goes through.

archetype: orchestrator

consumes:
  - specweaver/commons
  - specweaver/core/config
  - specweaver/infrastructure/llm
  - specweaver/workspace/ast/parsers
  - specweaver/workspace/ast/refactor
  - specweaver/workspace/project

