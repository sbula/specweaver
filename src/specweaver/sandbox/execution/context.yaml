name: execution
level: module
purpose: >
  Runs subprocesses and containers safely: output capture, timeouts, a clean environment, no credentials, path checks.

archetype: adapter

consumes:
  - specweaver/commons

forbids:
  - specweaver/sandbox/qa_runner/*
  - specweaver/core/flow/*
