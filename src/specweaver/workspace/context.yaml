# Workspace context boundary
name: workspace
purpose: >
  Projects, their SQLite store, the AST code and the project context.

archetype: store
description: |
  Contains all logic for managing user projects, AST parsing, and standards.
  Workspace MUST NOT depend on workflow orchestration or CLI interfaces.
consumes:
  - specweaver/infrastructure/database
  - specweaver/commons
  - specweaver/core/config
  - specweaver/sandbox
forbids:
  - specweaver/interfaces
  - specweaver/workflows
