name: project
level: module
purpose: >
  Project discovery, scaffolding, and constitution management
  (find project root, create directory structures, load and validate constitution files), and the
  prepare plan: which toolchain and test runner a project declares; the project profile and each
  file's framework, from the evaluator schemas (packaged and the project's own).

archetype: adapter

consumes:
  - specweaver/core/config
  - specweaver/workspace/context
  - specweaver/workspace/ast/parsers
  - specweaver/graph/topology
  - specweaver/workspace/analyzers
widens:
  specweaver/graph/topology: "`sw scan` builds the topology"
forbids:
  - specweaver/sandbox/*  # The loom boundary isolates execution (git, filesystem, processes). High-level orchestrators must never bypass the flow engine to natively execute raw processes.
  - specweaver/infrastructure/llm  # Pure logic modules must not depend on LLMs or prompt generation.

exposes:
  - resolve_project_path
  - scaffold_project
  - ScaffoldResult
  - sync_tach_toml
  - TachSyncResult
  - find_constitution
  - find_all_constitutions
  - check_constitution
  - generate_constitution
  - generate_constitution_from_standards
  - is_unmodified_starter
  - ConstitutionInfo
  - read_project_profile
  - load_evaluator_schemas
  - framework_for
  - FrameworkAnswer
  - languages_of
  - missing_schema

# -- Operational Metadata --------------------------------------------------
operational:
  async_ready: false
  concurrency_model: none
