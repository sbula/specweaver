name: ast.refactor
level: module
purpose: >
  Plans a code change across the files of a project: file contents in, new contents or a refusal out.

description: |
  The parsers see one file; a rename sees many. This module decides which occurrences of a name
  are proven uses of a symbol, and refuses when any one is unsure. It reads and writes nothing.

archetype: pure-logic

consumes:
  - specweaver/workspace/ast/parsers

forbids:
  - specweaver/sandbox/*
  - specweaver/interfaces/cli

exposes:
  - files
  - move
  - rename

# -- Operational Metadata --------------------------------------------------
operational:
  async_ready: true
  concurrency_model: none
