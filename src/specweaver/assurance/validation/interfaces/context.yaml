# Bounded context for the L6 presentation layer of Assurance Validation
name: validation-cli
purpose: >
  The `sw check` and `sw drift` commands: run the validation rules and detect drift.

description: "Validation and Drift Detection CLI commands"

archetype: orchestrator

exposes:
  - cli

consumes:
  - specweaver/interfaces/cli_kit
  - specweaver/interfaces/run_doors
  - specweaver/assurance/validation
  - specweaver/assurance/validation/io
  - specweaver/core/config
  - specweaver/core/flow/engine
  - specweaver/assurance/validation/orchestration
  - specweaver/graph/lineage
  - specweaver/sandbox/execution
  - specweaver/workspace/project
widens:
  specweaver/interfaces/cli_kit: "`sw check` and `sw drift` print through it"
  specweaver/interfaces/run_doors: "`sw drift` starts its run through it"
  specweaver/core/flow/engine: "`sw drift` builds the drift step and reads its result"
  specweaver/graph/lineage: "`sw check --lineage` reads the lineage scanner"
  specweaver/workspace/project: "`sw check` finds the active project"
  specweaver/sandbox/execution: "`sw drift` runs git through SubprocessExecutor (cli_drift.py)"
