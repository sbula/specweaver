name: assurance-graph
level: module
purpose: >
  The boundary rule: each folder's allowed imports, built from the context.yaml manifests of the
  module graph.

archetype: pure-logic

consumes:
  - specweaver/graph/topology
forbids:
  - specweaver/sandbox/*  # The loom boundary isolates execution (git, filesystem, processes). High-level orchestrators must never bypass the flow engine to natively execute raw processes.
  - specweaver/infrastructure/llm  # Pure logic modules must not depend on LLMs or prompt generation.
  - specweaver/workflows/drafting  # Rules and adapters must remain isolated from interactive drafts.
  - specweaver/workflows/implementation

exposes:
  - boundary_rule

# -- Operational Metadata --------------------------------------------------
operational:
  async_ready: false
  concurrency_model: none
