# Bounded context for the L6 presentation layer of Assurance Standards
name: standards-cli
purpose: >
  The `sw standards` commands: scan a project's code for its standards and show them.

description: "Standards and capabilities scanning CLI commands"

archetype: orchestrator

exposes:
  - cli

consumes:
  - specweaver/interfaces/cli_kit
  - specweaver/interfaces/run_doors
  - specweaver/assurance/standards
  - specweaver/core/config
  - specweaver/core/flow
  - specweaver/workspace/analyzers
  - specweaver/workspace/project
