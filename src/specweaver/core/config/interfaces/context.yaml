# Bounded context for the L6 presentation layer of Core Config
name: config-cli
purpose: >
  The `sw config` commands: show and change project and model settings.

description: "Core Configuration and LLM Routing CLI commands"

archetype: orchestrator

exposes:
  - cli

consumes:
  - specweaver/assurance/validation/io
  - specweaver/core/config
  - specweaver/core/config/bootstrap
  - specweaver/telemetry_logger
