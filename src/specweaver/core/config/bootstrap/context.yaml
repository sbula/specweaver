name: config.bootstrap
level: module
purpose: >
  DB schema bootstrap and settings hydration that must reach across domain
  stores (llm, flow, workspace) — the one piece of "config" that is
  legitimately adapter code, not pure-logic. Split out of core.config
  (TECH-001 SF-04) so core.config itself can be a true pure leaf.

archetype: adapter

consumes:
  - specweaver/infrastructure/database
  - specweaver/core/flow/store
  - specweaver/infrastructure/llm
  - specweaver/workspace
  - specweaver/workspace/memory
  - specweaver/core/config
widens:
  specweaver/infrastructure/database: "bootstrap opens specweaver.db and runs its schema steps"
  specweaver/core/flow/store: "bootstrap creates the run-state tables"
  specweaver/infrastructure/llm: "bootstrap creates the model tables and seeds the catalogue and prices"
  specweaver/workspace: "bootstrap creates the workspace tables"
  specweaver/workspace/memory: "bootstrap creates the memory tables"
forbids:
  - specweaver/sandbox/*  # Same boundary rule as core.config itself — no raw process execution.

exposes:
  - db_bootstrap.get_db
  - db_bootstrap.bootstrap_database
  - settings_loader.load_settings
  - settings_loader.load_settings_async
