name: flow
level: module
purpose: >
  Pipeline models, parsing, execution, gates, and feedback loops for the SpecWeaver flow engine.

description: |
  Defines the data model for pipelines (PipelineDefinition, PipelineStep,
  GateDefinition, StepAction, StepTarget) and provides YAML parsing.
  Includes step handlers (validate, review, draft, implement, test, lint-fix),
  gate logic (auto/HITL/validation), state management, and the pipeline runner
  with retry and feedback loop support.

archetype: orchestrator

consumes:
  - specweaver/commons
  - specweaver/infrastructure/database
  - specweaver/workspace/store
  - specweaver/sandbox/base
  - specweaver/sandbox/language/core
  - specweaver/sandbox/filesystem/core
  - specweaver/sandbox/protocol/core
  - specweaver/core/config
  - specweaver/core/flow/store
  - specweaver/workspace/memory
  - specweaver/workspace/project
  - specweaver/infrastructure/llm
  - specweaver/workflows/arbitration
  - specweaver/workflows/review
  - specweaver/workflows/implementation
  - specweaver/workflows/planning
  - specweaver/assurance/validation
  - specweaver/sandbox/git/core
  - specweaver/sandbox/qa_runner/core
  - specweaver/sandbox/code_structure/core
  - specweaver/sandbox/mcp/core
  - specweaver/sandbox/execution/core
  - specweaver/sandbox/dispatcher
  - specweaver/sandbox/security
  - specweaver/assurance/graph
  - specweaver/assurance/standards
  - specweaver/graph
  - specweaver/workflows/scenarios
  - specweaver/workspace/ast/parsers
forbids:
  - specweaver/sandbox/*/interfaces  # Atoms and raw orchestrators must not execute intent-gated agent tools directly.
    # NB: this refers to sandbox/commons (loom-internal — only atoms/tools may consume it),
    # NOT the top-level specweaver/commons, which is an L0 `pure-logic` foundation leaf
    # (consumes: [], forbids: specweaver/*) that every layer may legally depend on.
  - specweaver/workflows/drafting  # Rules and adapters must remain isolated from interactive drafts.
  - specweaver/workspace/context

exposes:
  - PipelineDefinition
  - PipelineStep
  - GateDefinition
  - StepAction
  - StepTarget
  - StepHandlerRegistry
  - LintFixHandler
  - DecomposeFeatureHandler
  - OrchestrateComponentsHandler
  - PipelineRunner
  - RunContext
  - RunnerEventCallback
  - RichPipelineDisplay
  - JsonPipelineDisplay

# -- Operational Metadata --------------------------------------------------
operational:
  async_ready: true
  concurrency_model: none
