name: flow-engine
level: module
purpose: >
  Runs a pipeline: steps in order, gates, retries, fan-out, isolation, handover and run state.

archetype: orchestrator

consumes:
  - specweaver/commons
  - specweaver/infrastructure/database
  - specweaver/core/config
  - specweaver/core/flow/run_state
  - specweaver/infrastructure/llm
  - specweaver/sandbox/base
  - specweaver/sandbox/git/core
  - specweaver/sandbox/security
  - specweaver/sandbox/language/core
  - specweaver/sandbox/filesystem/core
  - specweaver/sandbox/execution/core
  - specweaver/workflows/implementation
  - specweaver/workspace/store
  - specweaver/workspace/memory
  - specweaver/workspace/project

forbids:
  - specweaver/core/flow/handlers
