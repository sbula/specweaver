  - specweaver/sandbox/security
  - specweaver/sandbox/dispatcher
  - specweaver/sandbox/language/core
  - specweaver/sandbox/code_structure/core
  - specweaver/sandbox/execution/core
  - specweaver/sandbox/protocol/core
  - specweaver/sandbox/mcp/core
  - specweaver/workflows/arbitration
  - specweaver/workflows/implementation
  - specweaver/workflows/review
  - specweaver/workflows/planning
  - specweaver/workflows/scenarios
