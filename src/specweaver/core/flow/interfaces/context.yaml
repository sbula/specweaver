# src/specweaver/core/flow/interfaces/context.yaml
name: flow-cli

archetype: entry-point
purpose: CLI entrypoints for pipeline execution and state management
consumes:
  - specweaver/interfaces/cli_kit
  - specweaver/interfaces/run_doors
  - specweaver/core/flow/engine
  - specweaver/core/flow/handlers
  - specweaver/core/flow/run_state
  - specweaver/core/flow/store
  - specweaver/graph/topology
  - specweaver/core/config
  - specweaver/infrastructure/llm/interfaces
  - specweaver/workspace/analyzers
widens:
  specweaver/interfaces/cli_kit: "`sw run` prints and prompts through it"
  specweaver/interfaces/run_doors: "`sw run` starts runs through it"
  specweaver/workspace/analyzers: "`sw run` picks the project's analyzer"
forbids: []
