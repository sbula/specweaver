name: flow-run-state
level: module
purpose: >
  The run's state that the engine and the step handlers share: the run context, the failure log
  rule, the keys one step hands another through `feedback`, and the target's DAL and scenario store read through the registered project.

archetype: mixed

consumes:
  - specweaver/commons
  - specweaver/core/config
  - specweaver/infrastructure/llm
  - specweaver/assurance/validation
  - specweaver/workspace/lookups
  - specweaver/workspace/models
  - specweaver/workspace/ast/parsers

forbids:
  - specweaver/core/flow/engine
  - specweaver/core/flow/handlers

exposes:
  - RunContext
  - Drafters
  - log_step_failure
  - target_dal
  - scenario_store
  - registered
  - SCENARIO_EVIDENCE
  - RESOLVED_MENTIONS
  - StepFindings
  - send_findings
  - pop_findings
