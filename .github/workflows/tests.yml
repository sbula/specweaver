# The same gate as a local commit (scripts/commit_gated.py): the suite, then quality.py cb and doc.
# Never a real model: no secrets, no keys, and the default selection leaves out `live` and
# `toolchain`. tests/unit/test_ci_workflow_keeps_its_promises.py fails if that changes (TECH-094).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0

      - name: Install the tools the suite looks for
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.13.8"  # the uv the recipes copy from the pinned uv image
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install the locked dependencies
        run: uv sync --locked

      # The container tests skip when their image is not on the host; on CI a skip fails the run.
      - name: Pull the images the container tests run in
        run: |
          for image in \
            docker.io/library/python:3.11.18-slim@sha256:07d4824036af339fa1b6ef769cc99d9c10a141769538b52b3b597c84f7a7b535 \
            docker.io/library/python:3.12.16-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b \
            docker.io/library/python:3.13.18-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90 \
            ghcr.io/astral-sh/uv:0.13.8@sha256:5cc1805e2426484abca4ad46ea783bab281fdb225fd82d8ce6d66a81254bac85 \
            ghcr.io/astral-sh/uv:0.13.8-python3.12-trixie@sha256:a65858371a89e4e543d2018d2edc33b463b7ae3541a66f144e97ed431ebc8fb0 \
            docker.io/library/rust:1.100.0-slim@sha256:cc9edbcadf2c27013a642b1d1bb7504e26b1142d6b5ebe58f64cf2eb2bc128ae \
            docker.io/library/maven:3.10.0-eclipse-temurin-21@sha256:851ccd76d49d5646915645e5fb51e9b00ef53ad3dc68b0e9a2a9846b9c56bde3; do
            podman pull --quiet "$image"
          done

      - name: Suite (unit, integration, e2e)
        run: uv run python -m pytest -n auto -rfEs

      - name: Commit gate
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          case "$base" in ""|0000000000000000000000000000000000000000) base="HEAD~1" ;; esac
          uv run python scripts/quality.py cb --base "$base"

      - name: Docs gate
        run: uv run python scripts/quality.py doc
